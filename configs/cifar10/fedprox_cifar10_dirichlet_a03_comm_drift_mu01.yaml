seed: 42

dataset:
  name: "CIFAR10"
  batch_size: 64
  eval_batch_size: 256

federated:
  num_clients: 20
  clients_per_round: 10
  rounds: 20
  local_epochs: 1
  lr: 0.01
  mu: 0.01   # FedProx strength (this is the key change)

partition:
  type: "dirichlet"
  alpha: 0.3

logging:
  out_dir: "results/cifar10_fedprox_dirichlet_a03_comm_drift_mu01"